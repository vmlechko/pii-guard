# Конфигурация систем-потребителей Модуля безопасности ПД.
# Путь к файлу задаётся переменной окружения PII_CONFIG.
# Система выбирается заголовком запроса  X-System-Id: <id>.
# Если заголовок не передан — применяется default (все типы, демаскирование включено).
#
# Как настроить (кратко): пропишите систему в блоке systems, укажите allowed_types
# (какие типы ПД маскировать), enabled (доступ к модулю) и demasking (можно ли
# восстанавливать). Уберите allowed_types целиком — тогда берутся все 17 типов.

default_system: default

systems:
  # Полный доступ, все типы, демаскирование разрешено (поведение по умолчанию).
  default:
    name: "Базовая система"
    enabled: true
    demasking: true

  # Пример: чат-бот поддержки — маскируем только контактные и платёжные данные,
  # демаскирование запрещено (боту оригиналы не возвращаем).
  support-bot:
    name: "Чат-бот поддержки"
    enabled: true
    demasking: false
    allowed_types: [fio, phone, email, card, cvv, card_pin]

  # Пример: аналитический контур — маскируем всё, демаскирование разрешено.
  analytics:
    name: "Аналитический контур"
    enabled: true
    demasking: true

  # Пример: контекстное маскирование — PIN/CVV маскируются только вместе с номером карты.
  secure-vault:
    name: "Защищённый контур (контекстное маскирование)"
    enabled: true
    demasking: true
    contextual_masking: true

  # Пример: отключённая система — обращения в модуль запрещены (403).
  legacy-crm:
    name: "Устаревшая CRM"
    enabled: false
